<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company Brain Console</title>
  <link rel="stylesheet" href="/styles.css?v=4">
</head>
<body>
  <!-- Ícones (Lucide, ISC) usados pela nav, topbar e command palette. -->
  <svg hidden aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <g id="i-today"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></g>
      <g id="i-judgments"><path d="m14 13-8.5 8.5a2.12 2.12 0 0 1-3-3L11 10"/><path d="m16 16 6-6"/><path d="m8 8 6-6"/><path d="m9 7 8 8"/><path d="m21 11-8-8"/></g>
      <g id="i-routines"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></g>
      <g id="i-runs"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></g>
      <g id="i-canvas"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.59 13.51 6.83 3.98M15.41 6.51l-6.82 3.98"/></g>
      <g id="i-areas"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15M9 3.236v15"/></g>
      <g id="i-systems"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/></g>
      <g id="i-sources"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></g>
      <g id="i-experiments"><path d="M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2"/><path d="M8.5 2h7M7 16h10"/></g>
      <g id="i-compatibility"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1 1 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></g>
      <g id="i-governance"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5"/></g>
      <g id="i-health"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></g>
      <g id="i-society"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></g>
      <g id="i-search"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></g>
    </defs>
  </svg>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div><strong>Company Brain</strong><small>Console local</small></div>
      </div>
      <div id="area-switcher" aria-label="Contexto de área"></div>
      <nav id="navigation" aria-label="Navegação principal">
        <button data-view="today"><span class="nav-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#i-today"/></svg></span>Hoje <b data-count="attention">0</b></button>
        <button data-view="canvas"><span class="nav-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#i-canvas"/></svg></span>Canvas</button>
        <button data-view="judgments" data-views="judgments,routines,runs"><span class="nav-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#i-judgments"/></svg></span>Julgamento <b data-count="judgments">0</b></button>
        <button data-view="systems" data-views="systems,sources,areas,experiments"><span class="nav-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#i-systems"/></svg></span>Estrutura</button>
        <button data-view="compatibility" data-views="compatibility,governance,health"><span class="nav-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#i-compatibility"/></svg></span>Confiança</button>
        <button data-view="society"><span class="nav-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#i-society"/></svg></span>Society</button>
      </nav>
      <button id="collapse-nav" class="collapse-nav" type="button" title="Encolher menu ( [ )"><span class="nav-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></span><span>Encolher</span><kbd>[</kbd></button>
      <button id="open-palette" class="nav-hint" type="button"><span class="nav-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><use href="#i-search"/></svg></span><span>Buscar e navegar</span><kbd>⌘K</kbd></button>
      <div class="local-boundary"><i></i><div><strong>Somente nesta máquina</strong><span>Nenhum contexto vai à INEVITA</span></div></div>
      <p class="sys-line" id="sys-line">localhost · file-only · reference-only</p>
    </aside>

    <main>
      <header class="topbar">
        <div><p class="eyebrow" id="eyebrow">OPERAÇÃO</p><h1 id="page-title">Hoje</h1><p id="page-subtitle">O que pede julgamento e o que já está pronto para trabalhar.</p></div>
        <div class="top-actions"><span id="updated-at" class="updated-at">Lendo estado local…</span><button id="refresh" class="icon-button" aria-label="Atualizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#i-routines"/></svg></button></div>
      </header>
      <section id="summary" class="summary-grid" aria-label="Resumo operacional"></section>
      <section id="content" class="content" aria-live="polite">
        <div class="loading"><i></i><span>Compilando contratos e recibos locais…</span></div>
      </section>
    </main>
  </div>

  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawer" class="drawer" aria-label="Detalhes" aria-hidden="true">
    <button id="close-drawer" class="drawer-close" aria-label="Fechar">×</button>
    <div id="drawer-content"></div>
  </aside>

  <div id="palette-backdrop" class="palette-backdrop" hidden></div>
  <div id="palette" class="palette" role="dialog" aria-label="Buscar e navegar" hidden>
    <input id="palette-input" type="text" placeholder="Ir para… view, rotina, sistema ou experimento" autocomplete="off" spellcheck="false">
    <ul id="palette-list" role="listbox"></ul>
    <div class="palette-foot"><span><kbd>↑↓</kbd> navegar</span><span><kbd>↵</kbd> abrir</span><span><kbd>esc</kbd> fechar</span></div>
  </div>

  <dialog id="confirm-dialog" class="confirm-dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js?v=4"></script>
</body>
</html>
