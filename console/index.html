<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Company Brain Console</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
        <div><strong>Company Brain</strong><small>Console local</small></div>
      </div>
      <nav id="navigation" aria-label="Navegação principal">
        <button data-view="today"><span class="nav-glyph">◫</span>Hoje <b data-count="attention">0</b></button>
        <button data-view="areas"><span class="nav-glyph">⌘</span>Mapa / Áreas <b data-count="areas">0</b></button>
        <button data-view="systems"><span class="nav-glyph">◇</span>Sistemas <b data-count="systems">0</b></button>
        <button data-view="sources"><span class="nav-glyph">⌁</span>Fontes <b data-count="sources">0</b></button>
        <button class="active" data-view="routines"><span class="nav-glyph">↻</span>Rotinas <b data-count="routines">0</b></button>
        <button data-view="runs"><span class="nav-glyph">≡</span>Execuções</button>
        <button data-view="governance"><span class="nav-glyph">⊙</span>Governança</button>
        <button data-view="health"><span class="nav-glyph">＋</span>Saúde</button>
        <button data-view="society"><span class="nav-glyph">✦</span>Society</button>
      </nav>
      <div class="local-boundary"><i></i><div><strong>Somente nesta máquina</strong><span>Nenhum contexto vai à INEVITA</span></div></div>
    </aside>

    <main>
      <header class="topbar">
        <div><p class="eyebrow" id="eyebrow">OPERAÇÃO</p><h1 id="page-title">Rotinas</h1><p id="page-subtitle">Quando o cérebro trabalha, com qual contexto e quem precisa decidir.</p></div>
        <div class="top-actions"><span id="updated-at" class="updated-at">Lendo estado local…</span><button id="refresh" class="icon-button" aria-label="Atualizar">↻</button></div>
      </header>
      <section id="summary" class="summary-grid" aria-label="Resumo operacional"></section>
      <section id="content" class="content" aria-live="polite">
        <div class="loading"><i></i><span>Compilando contratos e recibos locais…</span></div>
      </section>
    </main>
  </div>

  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawer" class="drawer" aria-label="Detalhes da rotina" aria-hidden="true">
    <button id="close-drawer" class="drawer-close" aria-label="Fechar">×</button>
    <div id="drawer-content"></div>
  </aside>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
